events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Timeouts
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # Large PDF uploads support

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting Zones
    # 1. Standard API rate limit: 10 requests/sec per IP with burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 2. Upload rate limit: 2 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    upstream fastapi_upstream {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. UI & Static Assets
        location / {
            proxy_pass http://fastapi_upstream;
        }

        # 2. Real-time Streaming Endpoint (SSE specific configurations)
        location /api/v1/chat/stream {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi_upstream;

            # Disable buffering for live token-by-token streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        # 3. Standard Chat & Query APIs
        location /api/v1/chat {
            limit_req zone=api_limit burst=15 nodelay;
            proxy_pass http://fastapi_upstream;
        }

        # 4. File Upload Ingestion Endpoint
        location /api/v1/documents/ {
            limit_req zone=upload_limit burst=5 nodelay;
            proxy_pass http://fastapi_upstream;
            proxy_read_timeout 300s;
        }
    }
}